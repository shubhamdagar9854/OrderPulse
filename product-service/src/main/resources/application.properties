spring.application.name=product-service
server.port=${PORT:8082}
server.address=0.0.0.0
spring.main.banner-mode=off

# ===== Database (H2 for dev, MySQL for prod) =====
spring.datasource.url=jdbc:h2:mem:products_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# spring.datasource.url=jdbc:mysql://localhost:3306/products_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Feign =====
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ===== Caching (Caffeine) =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s
