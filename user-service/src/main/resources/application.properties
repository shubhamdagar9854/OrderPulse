spring.application.name=user-service
server.port=${PORT:8081}

# ===== Database (H2 for dev, MySQL for prod) =====
spring.datasource.url=jdbc:h2:mem:users_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# spring.datasource.url=jdbc:mysql://localhost:3306/users_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Eureka (disable for dev, enable for prod) =====
eureka.client.enabled=false

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.jwt.secret=OrderPulseSecretKey2024MustBeAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration=86400000

# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
