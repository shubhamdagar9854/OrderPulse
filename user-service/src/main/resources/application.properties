spring.application.name=user-service
server.port=${PORT:8081}
server.address=0.0.0.0
spring.main.banner-mode=off

# ===== Database (H2 for dev, MySQL for prod) =====
spring.datasource.url=jdbc:h2:mem:users_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3
# spring.datasource.url=jdbc:mysql://localhost:3306/users_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:OrderPulseSecretKey2024MustBeAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
