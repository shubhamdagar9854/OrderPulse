<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OrderPulse - Payments</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <h1>OrderPulse <span>Payments</span></h1>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <ul class="nav-links">
        <li><a href="index.html">Dashboard</a> </li>
        <li><a href="users.html">Users</a> </li>
        <li><a href="products.html">Products</a> </li>
        <li><a href="orders.html">Orders</a> </li>
        <li><a href="payments.html" class="active">Payments</a> </li>
        <li><a href="ai-assistant.html">AI Assistant</a> </li>
        <li class="nav-user-section" id="navUserSection"></li>
    </ul>
</nav>
<div class="container">
    <div class="grid-2">
        <div class="card">
            <h2>Process Payment</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label>Order ID</label>
                    <input type="number" id="payOrderId" min="1" required>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="payAmount" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn btn-success">Pay Now</button>
            </form>
            <div id="paymentResult" style="margin-top: 1rem;"></div>
        </div>
        <div class="card">
            <h2>Refund Payment</h2>
            <form id="refundForm">
                <div class="form-group">
                    <label>Order ID</label>
                    <input type="number" id="refundOrderId" min="1" required>
                </div>
                <button type="submit" class="btn btn-danger">Refund</button>
            </form>
            <div id="refundResult" style="margin-top: 1rem;"></div>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/payments.js "></script>
<script>
function toggleNav() {
    document.querySelector('.nav-links').classList.toggle('open');
}
(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const section = document.getElementById('navUserSection');
    if (section && user.name) {
        section.innerHTML = '<span style="color:rgba(255,255,255,0.8);font-size:0.85rem;">' + user.name + ' (' + user.role + ')</span>' +
            '<button class="btn-logout" onclick="localStorage.removeItem(\'token\');localStorage.removeItem(\'user\');window.location.href=\'/index.html\'" style="background:rgba(255,255,255,0.15);color:#fff;border:none;padding:0.3rem 0.8rem;border-radius:4px;cursor:pointer;font-size:0.8rem;">Logout</button>';
    }
})();
</script>
</body>
</html>
