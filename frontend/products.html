<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OrderPulse - Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <h1>OrderPulse <span>Products</span></h1>
    <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
    <ul class="nav-links">
        <li><a href="index.html">Dashboard</a> </li>
        <li><a href="users.html">Users</a> </li>
        <li><a href="products.html" class="active">Products</a> </li>
        <li><a href="orders.html">Orders</a> </li>
        <li><a href="payments.html">Payment</a> </li>
        <li><a href="ai-assistant.html">AI Assistant</a> </li>
        <li class="nav-user-section" id="navUserSection"></li>
    </ul>
</nav>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>All Products</h2>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <span id="userRoleDisplay" style="font-size:0.85rem;color:#666;"></span>
                <button id="addProductBtn" class="btn btn-primary" onclick="openAddModal()">+Add Products</button>
            </div>
        </div>
        <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="productTableBody">
                <tr><td colspan="6" style="text-align: center">Loading....</td> </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
<div id="addModal" class="modal">
    <div class="modal-content">
    <span class="close" onclick="closeAddModal()">x</span>
    <h2>Add New Product</h2>
    <form id="addProductForm">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="addName" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="addDescription" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="number" id="addPrice" step="0.01" min="0" required>
        </div>
        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" id="addQuantity" min="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Product</button>
    </form>
    </div>
</div>
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">x</span>
        <h2>Edit Product</h2>
        <form id="editProductForm">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="editName" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" id="editPrice" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" id="editQuantity" min="0" required>
            </div>
            <button type="submit" class="btn btn-success">Update</button>
        </form>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script>
function toggleNav() {
    document.querySelector('.nav-links').classList.toggle('open');
}
(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const section = document.getElementById('navUserSection');
    if (section && user.name) {
        section.innerHTML = '<span style="color:rgba(255,255,255,0.8);font-size:0.85rem;">' + user.name + ' (' + user.role + ')</span>' +
            '<button class="btn-logout" onclick="localStorage.removeItem(\'token\');localStorage.removeItem(\'user\');window.location.href=\'/index.html\'" style="background:rgba(255,255,255,0.15);color:#fff;border:none;padding:0.3rem 0.8rem;border-radius:4px;cursor:pointer;font-size:0.8rem;">Logout</button>';
    }
})();
</script>
</body>
</html>
