<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OrderPulse - Users</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <h1>OrderPulse <span>User</span></h1>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a> </li>
            <li><a href="users.html" class="active">Users</a> </li>
            <li><a href="products.html">Products</a> </li>
            <li><a href="orders.html">Orders</a> </li>
            <li><a href="payments.html">Payments</a> </li>
            <li><a href="ai-assistant.html">AI Assistant</a> </li>
            <li class="nav-user-section" id="navUserSection"></li>
        </ul>
    </nav>
    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center">
                <h2>All Users</h2>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add User</button>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                        <tr><td colspan="6" style="text-align: center;">Loading.....</td> </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddModal()">x</span>
            <h2>Register New User</h2>
            <form id="addUserForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="addName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="addEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="addPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLoginModal()">x</span>
            <h2>User Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-success">Login</button>
            </form>
            <div id="loginResult" style="margin-top: 1rem;"></div>
        </div>
    </div>
<script src="js/api.js"></script>
<script src="js/users.js"></script>
<script>
(function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const section = document.getElementById('navUserSection');
    if (section && user.name) {
        section.innerHTML = '<span style="color:rgba(255,255,255,0.8);font-size:0.85rem;">' + user.name + ' (' + user.role + ')</span>' +
            '<button class="btn-logout" onclick="localStorage.removeItem(\'token\');localStorage.removeItem(\'user\');window.location.href=\'/index.html\'" style="background:rgba(255,255,255,0.15);color:#fff;border:none;padding:0.3rem 0.8rem;border-radius:4px;cursor:pointer;font-size:0.8rem;">Logout</button>';
    }
})();
</script>
</body>
</html>
