<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OrderPulse - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }
        .auth-card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #444;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-result {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }
        .auth-result.error { display: block; background: #fed7d7; color: #9b2c2c; }
        .auth-result.success { display: block; background: #c6f6d5; color: #276749; }
        .dashboard-only { display: none; }
        body.logged-in .auth-container { display: none; }
        body.logged-in .dashboard-only { display: block; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255,255,255,0.9);
            font-size: 0.9rem;
        }
        .user-info .btn-logout {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-info .btn-logout:hover { background: rgba(255,255,255,0.25); }
        .nav-user-section {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1> OrderPulse <span id="navTitle">Login</span></h1>
        <button class="nav-toggle" onclick="toggleNav()">&#9776;</button>
        <ul class="nav-links dashboard-only">
            <li><a href="index.html" class="active">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="payments.html">Payment</a></li>
            <li><a href="ai-assistant.html">AI</a></li>
            <li class="nav-user-section" id="navUserSection"></li>
        </ul>
    </nav>

    <!-- Auth Section (visible when logged out) -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <h2>Welcome to OrderPulse</h2>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">Login</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
                <div class="auth-result" id="loginResult"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%">Register</button>
                <div class="auth-result" id="registerResult"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard Section (visible when logged in) -->
    <div class="container dashboard-only" id="dashboardContainer">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3 id="userCount">0</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-card">
                <h3 id="productCount">0</h3>
                <p>Total Products</p>
            </div>
            <div class="stat-card">
                <h3 id="ordercount">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <h3 id="paymentcount">0</h3>
                <p>Total Payments</p>
            </div>
        </div>
        <div class="card">
            <h2>Quick Actions</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
                <a href="users.html" class="btn btn-primary">Manage Users</a>
                <a href="products.html" class="btn btn-success">Manage Products</a>
                <a href="orders.html" class="btn btn-warning">View Orders</a>
                <a href="payments.html" class="btn btn-danger">Process Payment</a>
                <a href="ai-assistant.html" class="btn btn-primary">AI Assistant</a>
            </div>
        </div>
    </div>

<script src="js/api.js"></script>
<script>
function getToken() { return localStorage.getItem('token'); }
function getUser() { return JSON.parse(localStorage.getItem('user') || '{}'); }

function toggleNav() {
    document.querySelector('.nav-links').classList.toggle('open');
}

function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.getElementById('loginResult').style.display = 'none';
    document.getElementById('registerResult').style.display = 'none';
    if (tab === 'login') {
        document.querySelector('.auth-tab').classList.add('active');
        document.getElementById('loginForm').classList.add('active');
    } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('loginResult');
    try {
        const res = await userAPI.login({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        });
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify({ userId: res.userId, name: res.name, role: res.role }));
        resultDiv.className = 'auth-result success';
        resultDiv.textContent = 'Logged in as ' + res.name + ' (' + res.role + ')';
        resultDiv.style.display = 'block';
        setTimeout(checkAuth, 500);
    } catch (err) {
        resultDiv.className = 'auth-result error';
        resultDiv.textContent = 'Login failed: ' + err.message;
        resultDiv.style.display = 'block';
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('registerResult');
    try {
        const data = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
        };
        await userAPI.register(data);
        const res = await userAPI.login({ email: data.email, password: data.password });
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify({ userId: res.userId, name: res.name, role: res.role }));
        resultDiv.className = 'auth-result success';
        resultDiv.textContent = 'Registered & logged in as ' + res.name + ' (' + res.role + ')';
        resultDiv.style.display = 'block';
        setTimeout(checkAuth, 500);
    } catch (err) {
        resultDiv.className = 'auth-result error';
        resultDiv.textContent = 'Registration failed: ' + err.message;
        resultDiv.style.display = 'block';
    }
}

function checkAuth() {
    const token = getToken();
    const user = getUser();
    if (token && user.userId) {
        document.body.classList.add('logged-in');
        document.getElementById('navTitle').textContent = 'Dashboard';
        document.getElementById('navUserSection').innerHTML = `
            <span style="color:rgba(255,255,255,0.8);font-size:0.85rem;">${user.name} (${user.role})</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        `;
        loadStats();
    } else {
        document.body.classList.remove('logged-in');
        document.getElementById('navTitle').textContent = 'Login';
        document.getElementById('navUserSection').innerHTML = '';
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    checkAuth();
}

async function loadStats() {
    try {
        const [users, products, orders, payments] = await Promise.all([
            userAPI.getAll().catch(() => []),
            productAPI.getAll().catch(() => []),
            orderAPI.getAll().catch(() => []),
            paymentAPI.getAll().catch(() => [])
        ]);
        document.getElementById('userCount').textContent = Array.isArray(users) ? users.length : 'N/A';
        document.getElementById('productCount').textContent = products.length;
        document.getElementById('ordercount').textContent = Array.isArray(orders) ? orders.length : 'N/A';
        document.getElementById('paymentcount').textContent = Array.isArray(payments) ? payments.length : 'N/A';
    } catch (err) {
        console.error('Stats error:', err);
    }
}

checkAuth();
</script>
</body>
</html>
