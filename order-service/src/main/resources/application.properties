spring.application.name=order-service
server.port=8083

# ===== Database (H2 for dev, MySQL for prod) =====
spring.datasource.url=jdbc:h2:mem:orders_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# spring.datasource.url=jdbc:mysql://localhost:3306/orders_db
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Eureka (disable for dev, enable for prod) =====
eureka.client.enabled=false

# ===== Kafka (timed out quickly for dev when Kafka is not running) =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===== Feign =====
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# ===== Resilience4j =====
resilience4j.circuitbreaker.instances.productService.register-health-indicator=true
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,ratelimiters
management.endpoint.health.show-details=always

# ===== Rate Limiter =====
resilience4j.ratelimiter.instances.createOrder.limit-for-period=5
resilience4j.ratelimiter.instances.createOrder.limit-refresh-period=1s
resilience4j.ratelimiter.instances.createOrder.timeout-duration=500ms
